[project]
name = "print3d"
version = "0.1.0"
description = "Free-software pipeline converting 2D images into print-ready 3D models for a Bambu Lab A1 Mini."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "vtracer",
    "potracer",
    "shapely",
    "build123d>=0.11",
    "trimesh>=5.0",
    # networkx + lxml: required by trimesh's 3MF export (py-lib3mf has no
    # Windows wheels; do not remove as "unused" — nothing else pulls them).
    "networkx",
    "lxml",
    "pillow",
]

[project.scripts]
make3d = "print3d.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print3d"]
